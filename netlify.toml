[build]
  publish = "."

# Proxy same-origin ke Google Sheets Publish to web.
# HTML dipakai karena mempertahankan warna cell status.
[[redirects]]
  from = "/sheet-html"
  to = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSod7Mdzh3NW4a8uyA1cXEF51Clo-8I1KapKosN5-XgOyqXMWYoQ31_vdM53RhGJn_s6m8ETxNeTjqi/pubhtml"
  status = 200
  force = true

# CSV hanya fallback bila suatu saat status ditulis sebagai teks.
[[redirects]]
  from = "/sheet-csv"
  to = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSod7Mdzh3NW4a8uyA1cXEF51Clo-8I1KapKosN5-XgOyqXMWYoQ31_vdM53RhGJn_s6m8ETxNeTjqi/pub?output=csv"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
